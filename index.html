 $('opts').innerHTML=L.map(k=>{let c='o';if(locked){if(k===x.a)c+=' ok';else if(k===a)c+=' no'}else if(k===a)c+=' sel';
  return `<button class="${c}" data-k="${k}" ${locked?'disabled':''}><b>${k})</b><span>${fmt(x.o[k])}</span></button>`}).join('');
 $('opts').querySelectorAll('.o').forEach(b=>b.onclick=()=>{ans[i]=b.dataset.k;render()});
 $('prev').disabled=i===0;$('next').textContent=i===set.length-1?'Finish':'Next';
 $('dots').querySelectorAll('.dot').forEach((d,k)=>{d.className='dot'+(ans[k]===null?'':instant?(ans[k]===set[k].a?' ok':' no'):' a')+(k===i?' c':'')});}
$('prev').onclick=()=>{if(i>0){i--;render()}};
$('next').onclick=()=>{if(i<set.length-1){i++;render();return}
 const left=ans.filter(v=>v===null).length;
 if(left&&!confirm(left+' question(s) unanswered. Finish anyway?'))return;finish()};
$('quit').onclick=()=>{if(confirm('Quit this test? Progress will be lost.'))show('start')};
function finish(){let c=0,w=0,s=0;ans.forEach((a,k)=>{if(a===null)s++;else if(a===set[k].a)c++;else w++});
 const p=Math.round(c/set.length*100);
 $('pct').textContent=p+'%';$('nc').textContent=c;$('nw').textContent=w;$('ns').textContent=s;
 $('msg').textContent=c+' out of '+set.length+' — '+(p>=86?'Excellent!':p>=71?'Good job!':p>=56?'Not bad, keep practising.':'Keep practising — you can do it!');
 $('retryW').hidden=(w+s)===0;filter='all';review();show('result');window.scrollTo(0,0)}
function review(){$('review').innerHTML=set.map((x,k)=>{const a=ans[k],ok=a===x.a;if(filter==='w'&&ok)return'';if(filter==='c'&&!ok)return'';
 return `<div class="rv ${ok?'c':'w'}"><p>${k+1}. ${fmt(x.q)} <span class="mu">(#${x.n})</span></p>
 <div>Your answer: <b class="${ok?'g':'r'}">${a?a+') '+esc(x.o[a]):'— skipped'}</b></div>
 ${ok?'':`<div>Correct answer: <b class="g">${x.a}) ${esc(x.o[x.a])}</b></div>`}</div>`}).join('')||'<div class="mu" style="text-align:center;padding:20px">Nothing to show here.</div>'}
document.querySelectorAll('.tabs .chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;review()});
$('again').onclick=()=>show('start');
$('retryW').onclick=()=>{const bad=set.filter((x,k)=>ans[k]!==x.a);begin(shuffle(bad),'Retry mistakes')};
</script></body></html>
