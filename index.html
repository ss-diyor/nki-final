/* ---------- Quiz ---------- */
/* ans[i] = original option index (0-3); the displayed letter is its position in x.ord */
function begin(list,name){set=list.map(x=>({...x,ord:shuffle([0,1,2,3])}));ans=new Array(set.length).fill(null);i=0;label=name;instant=$('instant').checked;show('quiz');
 $('dots').innerHTML='';set.forEach((_,k)=>{const d=document.createElement('button');d.className='dot';d.textContent=k+1;d.onclick=()=>{i=k;render()};$('dots').appendChild(d)});render();window.scrollTo(0,0)}
function render(){const x=set[i],a=ans[i],locked=instant&&a!==null;
 $('mode').textContent=t('mode_'+label);$('pos').textContent=t('pos',i+1,set.length);
 $('pb').style.width=(ans.filter(v=>v!==null).length/set.length*100)+'%';
 $('qt').innerHTML=fmt(x.q);
 $('opts').innerHTML=x.ord.map((k,p)=>{let c='o';if(locked){if(x.c.includes(k))c+=' ok';else if(k===a)c+=' no'}else if(k===a)c+=' sel';
  return `<button class="${c}" data-k="${k}" ${locked?'disabled':''}><b>${LET[p]})</b><span>${fmt(x.o[k])}</span></button>`}).join('');
 $('opts').querySelectorAll('.o').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;render()});
 $('finishHere').disabled=ans.every(v=>v===null);$('prev').disabled=i===0;$('next').textContent=t(i===set.length-1?'finish':'next');
 $('dots').querySelectorAll('.dot').forEach((d,k)=>{d.className='dot'+(ans[k]===null?'':instant?(isOk(set[k],ans[k])?' ok':' no'):' a')+(k===i?' c':'')})}
function goNext(){if(i<set.length-1){i++;render();return}
 const left=ans.filter(v=>v===null).length;
 if(left&&!confirm(t('unans',left)))return;finish()}
$('prev').onclick=()=>{if(i>0){i--;render()}};
$('next').onclick=goNext;
$('finishHere').onclick=finishHere;
$('quit').onclick=()=>{if(confirm(t('quitQ')))show('start')};

function resultText(){if(!lastRes)return;const{c,w,s,p,n,saved,partial,of}=lastRes;
 $('pct').textContent=p+'%';$('nc').textContent=c;$('nw').textContent=w;$('ns').textContent=s;
 $('msg').textContent=t('outOf',c,n)+' · '+t(p>=86?'p1':p>=71?'p2':p>=56?'p3':'p4');
 $('saved').textContent=saved?t('saved'):'';$('partial').textContent=partial?t('partialNote',n,of):'';$('retryW').hidden=(w+s)===0}
let resN=0;
function finish(limit){const n=limit||set.length;let c=0,w=0,s=0;
 for(let k=0;k<n;k++){const a=ans[k];if(a===null)s++;else if(isOk(set[k],a))c++;else w++}
 const p=Math.round(c/n*100),pr=me(),partial=n<set.length;let saved=false;
 if(pr){const rec={t:Date.now(),mode:label,total:n,c,w,s,p};if(partial){rec.partial=true;rec.of=set.length}pr.history.push(rec);saveDB();saved=true}
 resN=n;lastRes={c,w,s,p,n,of:set.length,partial,saved};resultText();filter='all';review();show('result');window.scrollTo(0,0)}
function finishHere(){let last=-1;ans.forEach((a,k)=>{if(a!==null)last=k});
 if(last<0){alert(t('fhNone'));return}
 const n=last+1;if(!confirm(t('fhQ',n,set.length)))return;finish(n>=set.length?0:n)}
function uniq(a){return a.filter((v,k)=>a.indexOf(v)===k)}
function review(){$('review').innerHTML=set.slice(0,resN).map((x,k)=>{const a=ans[k],ok=isOk(x,a);if(filter==='w'&&ok)return'';if(filter==='c'&&!ok)return'';
 const corr=uniq(x.c.map(j=>x.o[j]));
 return `<div class="rv ${ok?'c':'w'}"><p>${k+1}. ${fmt(x.q)}</p>
 <div>${t('yourAns')}: <b class="${ok?'g':'r'}">${a!==null?fmt(x.o[a]):t('skip')}</b></div>
 ${ok?'':`<div>${t(corr.length>1?'corrAnsP':'corrAns')}: <b class="g">${corr.map(fmt).join(' / ')}</b></div>`}</div>`}).join('')||`<div class="empty">${t('nothing')}</div>`}
document.querySelectorAll('.tabs .chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;review()});
$('again').onclick=()=>show('start');
$('retryW').onclick=()=>begin(set.filter((x,k)=>k<resN&&!isOk(x,ans[k])),'retry');

/* ---------- Keyboard ---------- */
document.addEventListener('keydown',e=>{
 if(cur!=='quiz'||e.ctrlKey||e.metaKey||e.altKey)return;
 const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'))return;
 const k=e.key;
 if(k==='ArrowRight'){e.preventDefault();if(i<set.length-1){i++;render()}}
 else if(k==='ArrowLeft'){e.preventDefault();if(i>0){i--;render()}}
 else if(/^[1-4]$/.test(k)){e.preventDefault();if(instant&&ans[i]!==null)return;ans[i]=set[i].ord[+k-1];render()}
 else if(k==='Enter'&&i===set.length-1){e.preventDefault();if(document.activeElement)document.activeElement.blur();goNext()}
});

/* ---------- Global search ---------- */
const norm=s=>s.toLowerCase().replace(/ё/g,'е').replace(/[\u2018\u2019\u02bb\u02bc\u02b9`\u00b4]/g,"'");
function hl(text,terms){text=plain(text);if(!terms.length)return fmt(text);const n=norm(text),r=[];
 terms.forEach(tm=>{let p=0;while((p=n.indexOf(tm,p))>-1){r.push([p,p+tm.length]);p+=tm.length}});
 if(!r.length)return fmt(text);r.sort((a,b)=>a[0]-b[0]);const m=[r[0].slice()];
 for(const q of r.slice(1)){const l=m[m.length-1];if(q[0]<=l[1])l[1]=Math.max(l[1],q[1]);else m.push(q.slice())}
 let o='',p=0;m.forEach(([s,e])=>{o+=esc(text.slice(p,s))+'<mark>'+esc(text.slice(s,e))+'</mark>';p=e});return o+esc(text.slice(p))}
$('bSearch').onclick=()=>{if(cur==='search'){show(beforeSearch);return}beforeSearch=cur;show('search');$('sq').focus();runSearch()};
let tmr;$('sq').addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(runSearch,120)});
function runSearch(){const raw=$('sq').value.trim();
 if(!raw){$('sinfo').textContent='';$('slist').innerHTML='';return}
 const terms=norm(raw).split(/\s+/).filter(Boolean),found=[];
 BANK.forEach(x=>{const f=[['q',norm(plain(x.q))],...x.o.map((o,k)=>[k,norm(plain(o))])];
  const all=f.map(v=>v[1]).join(' | ');
  const num=terms.length===1&&/^\d+$/.test(terms[0])&&+terms[0]===x.n;
  if(!num&&!terms.every(tm=>all.includes(tm)))return;
  const hits=new Set(),where=[];f.forEach(([k,s])=>{if(terms.some(tm=>s.includes(tm)))hits.add(k)});
  if(num)where.push(t('tNum'));if(hits.has('q'))where.push(t('tQ'));[0,1,2,3].forEach(k=>{if(hits.has(k))where.push(t('tOpt',LET[k]))});
  found.push({x,hits,where})});
 $('sinfo').textContent=found.length?t('sRes',found.length):t('sNone');
 $('slist').innerHTML=found.length?found.map(({x,hits,where})=>`<div class="card" style="margin-bottom:10px;padding:14px 16px">
  <div class="q" style="font-size:1.05rem">${x.n}. ${hl(x.q,terms)}</div>
  ${x.o.map((o,k)=>`<div class="so${x.c.includes(k)?' ok':''}${hits.has(k)?' hit':''}"><b>${LET[k]})</b> ${hl(o,terms)}</div>`).join('')}
  <div class="mu" style="margin-top:10px">${where.map(w=>'<span class="tag">'+w+'</span>').join('')}</div></div>`).join(''):`<div class="empty">${t('sEmpty')}</div>`}
